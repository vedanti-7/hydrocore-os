name: hydrocore-broker

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hydrocore-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  mosquitto_data:
  mosquitto_log: